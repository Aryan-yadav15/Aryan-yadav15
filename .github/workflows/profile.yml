# Rebuilds the snake + stats card daily and publishes them to the `output` branch.
name: profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        run: |
          pip install --quiet fonttools brotli
          python3 assets/stats.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#f56300&color_dots=#e5e5ea,#c7c7cc,#a1a1a6,#6e6e73,#1d1d1f
            dist/snake-dark.svg?color_snake=#ff9f0a&color_dots=#1c1c1e,#3a3a3c,#636366,#a1a1a6,#f5f5f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
